<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Fixes media queries not working on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title></title> is set by Elm -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- My stylesheet -->
    <link rel="stylesheet" href="src/style.css">

    <!-- Highlight.js for syntax highlighting -->
    <!-- Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark-reasonable.min.css">
    <!-- Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Languages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/elm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>

    <!-- Elm generated code! -->
    <script src="build/elm.js"></script>
</head>
<body>
    <script>
        // Function to highlight all code blocks
        function trimAndHighlightCodeBlocks() {
            document.querySelectorAll('pre code').forEach(block => {
                // Skip if already visited
                if (block.classList.contains('hljs')) return;
                // elm-explorations/markdown adds 'lang-*' classes
                // but highlight.js expects 'language-*' classes
                // Convert lang-* to language-* for compatibility
                block.classList.forEach(className => {
                    if (className.startsWith('lang-')) {
                        const language = className.substring(5);
                        block.classList.add('language-' + language);
                    }
                });
                // Highlight
                hljs.highlightElement(block);
                // Trim
                block.innerHTML = block.innerHTML.trim();
            });
        }

        function fixScripts() {
            document.querySelectorAll('[script]').forEach(el => {
                el.hidden = true;
                const newEl = document.createElement('script');
                newEl.innerHTML = el.getAttribute('script');
                document.body.appendChild(newEl);
            });
        }

        var app = Elm.Main.init({
            flags: {
                userAgent: navigator.userAgent.toLowerCase(),
            },
        });
        app.ports.onViewPost.subscribe(() => {
            // Wait one frame, so Elm can finish messing with the DOM.
            window.requestAnimationFrame(() => {
                trimAndHighlightCodeBlocks();
                fixScripts();
            });
        });
    </script>
</body>
</html>
